name: CineVault Multi-Environment CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================================
  # BUILD AND TEST
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Verify WAR
        run: |
          echo "Checking generated WAR..."
          test -f target/cinevault.war
          ls -lh target/cinevault.war
          echo "WAR created successfully."

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinevault-war
          path: target/cinevault.war
          retention-days: 7


  # ==========================================================
  # DEV
  # ==========================================================
  deploy-dev:
    name: Deploy → DEV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: cinevault-war
          path: artifact

      - name: Prepare SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cinevault.pem

          chmod 600 ~/.ssh/cinevault.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to DEV
        shell: bash
        run: |
          set -e

          echo "Deploying CineVault to DEV..."

          scp \
            -i ~/.ssh/cinevault.pem \
            artifact/cinevault.war \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cinevault.war"

          ssh \
            -i ~/.ssh/cinevault.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' << 'EOF'

          set -e

          echo "Stopping Tomcat..."
          sudo systemctl stop tomcat10

          echo "Removing previous deployment..."
          sudo rm -rf /usr/share/tomcat10/webapps/cinevault
          sudo rm -f /usr/share/tomcat10/webapps/cinevault.war

          echo "Installing new WAR..."
          sudo cp /tmp/cinevault.war /usr/share/tomcat10/webapps/cinevault.war

          echo "Starting Tomcat..."
          sudo systemctl start tomcat10

          echo "Waiting for application..."
          for i in {1..12}; do
            if curl -fsS http://localhost:8080/cinevault/ > /dev/null; then
              echo "DEV application is responding."
              exit 0
            fi

            sleep 5
          done

          echo "DEV deployment health check failed."
          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # TEST
  # ==========================================================
  deploy-test:
    name: Deploy → TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment:
      name: test

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: cinevault-war
          path: artifact

      - name: Prepare SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cinevault.pem

          chmod 600 ~/.ssh/cinevault.pem

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to TEST
        shell: bash
        run: |
          set -e

          echo "Deploying CineVault to TEST..."

          scp \
            -i ~/.ssh/cinevault.pem \
            artifact/cinevault.war \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cinevault.war"

          ssh \
            -i ~/.ssh/cinevault.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' << 'EOF'

          set -e

          echo "Stopping Tomcat..."
          sudo systemctl stop tomcat10

          echo "Removing previous deployment..."
          sudo rm -rf /usr/share/tomcat10/webapps/cinevault
          sudo rm -f /usr/share/tomcat10/webapps/cinevault.war

          echo "Installing new WAR..."
          sudo cp /tmp/cinevault.war /usr/share/tomcat10/webapps/cinevault.war

          echo "Starting Tomcat..."
          sudo systemctl start tomcat10

          echo "Waiting for application..."
          for i in {1..12}; do
            if curl -fsS http://localhost:8080/cinevault/ > /dev/null; then
              echo "TEST application is responding."
              exit 0
            fi

            sleep 5
          done

          echo "TEST deployment health check failed."
          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # PRE-PRODUCTION
  # ==========================================================
  deploy-preprod:
    name: Deploy → PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest

    environment:
      name: pre-production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: cinevault-war
          path: artifact

      - name: Prepare SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cinevault.pem

          chmod 600 ~/.ssh/cinevault.pem

