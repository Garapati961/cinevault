name: CineVault CI/CD
on:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build WAR
        run: mvn -B clean package
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: cinevault-war
          path: target/cinevault.war
