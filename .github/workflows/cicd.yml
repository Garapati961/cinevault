name: CineVault CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WAR
        run: mvn -B clean package

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cinevault.pem
          chmod 600 ~/.ssh/cinevault.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy WAR to EC2
        run: |
          scp -i ~/.ssh/cinevault.pem \
            target/cinevault.war \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/cinevault.war

      - name: Deploy to Tomcat
        run: |
          ssh -i ~/.ssh/cinevault.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          sudo rm -rf /usr/share/tomcat10/webapps/cinevault
          sudo rm -f /usr/share/tomcat10/webapps/cinevault.war

          sudo cp /tmp/cinevault.war /usr/share/tomcat10/webapps/

          sudo systemctl restart tomcat10

          sleep 8

          curl -f http://localhost:8080/cinevault/

          EOF
