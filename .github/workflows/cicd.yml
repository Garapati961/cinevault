          ssh \
            -i ~/.ssh/cinevault.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' << 'EOF'

          set -e

          echo "Stopping Tomcat..."
          sudo systemctl stop tomcat10

          echo "Removing previous deployment..."
          sudo rm -rf /usr/share/tomcat10/webapps/cinevault
          sudo rm -f /usr/share/tomcat10/webapps/cinevault.war

          echo "Installing new WAR..."
          sudo cp /tmp/cinevault.war /usr/share/tomcat10/webapps/cinevault.war

          echo "Starting Tomcat..."
          sudo systemctl start tomcat10

          echo "Waiting for application..."
          for i in {1..12}; do
            if curl -fsS http://localhost:8080/cinevault/ > /dev/null; then
              echo "PRE-PROD application is responding."
              exit 0
            fi

            sleep 5
          done

          echo "PRE-PROD deployment health check failed."
          sudo systemctl status tomcat10 --no-pager || true

          exit 1

          EOF


  # ==========================================================
  # PRODUCTION
  # ==========================================================
  deploy-production:
    name: Deploy → PRODUCTION
    needs: deploy-preprod
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
